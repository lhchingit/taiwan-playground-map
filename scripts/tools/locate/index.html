<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>人工定位工具｜全台放電地圖</title>
    <link rel="stylesheet" href="/vendor/maplibre-gl.css" />
    <style>
      :root {
        --paper: #f5f7f2;
        --panel: #fff;
        --ink: #1d2a25;
        --muted: #5e6e67;
        --line: #dce3dc;
        --teal: #1c7a69;
        --teal-soft: #ddf0ea;
        --slide: #e27a1f;
        --slide-soft: #fcebd9;
        --warn: #b42318;
      }
      * {
        box-sizing: border-box;
      }
      /* label 設了 display: grid，hidden 要明確蓋過去 */
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          14px/1.5 'Noto Sans TC',
          'PingFang TC',
          'Microsoft JhengHei',
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 8px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      .rule {
        color: var(--warn);
        font-weight: 700;
        margin: 2px 0 0;
        font-size: 13px;
      }
      main {
        display: grid;
        grid-template-columns: 420px 1fr;
        min-height: 0;
      }
      aside {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button,
      button.btn {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
        padding: 5px 10px;
        cursor: pointer;
        font: inherit;
      }
      .tabs button[aria-pressed='true'],
      button.primary {
        background: var(--teal);
        color: #fff;
        border-color: var(--teal);
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 6px;
        overflow: auto;
        flex: 1;
      }
      #list button {
        width: 100%;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 6px 8px;
        margin-bottom: 4px;
        cursor: pointer;
        font: inherit;
        display: grid;
        gap: 2px;
      }
      #list button[aria-current='true'] {
        border-color: var(--teal);
        box-shadow: 0 0 0 1px var(--teal);
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .badge {
        font-size: 11px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--slide-soft);
      }
      .badge.done {
        background: var(--teal-soft);
      }
      #detail {
        border-top: 1px solid var(--line);
        padding: 10px 12px;
        max-height: 58%;
        overflow: auto;
      }
      #detail h2 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      #detail dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 6px 0;
        font-size: 13px;
      }
      #detail dt {
        color: var(--muted);
      }
      #detail dd {
        margin: 0;
      }
      form {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }
      label {
        display: grid;
        gap: 2px;
        font-size: 13px;
      }
      select,
      input {
        font: inherit;
        padding: 5px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .errors {
        color: var(--warn);
        font-size: 13px;
        margin: 0;
      }
      .ok {
        color: var(--teal);
        font-size: 13px;
        margin: 0;
      }
      .mapwrap {
        position: relative;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .search {
        position: absolute;
        z-index: 2;
        top: 10px;
        left: 10px;
        width: min(360px, calc(100% - 20px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        display: grid;
        gap: 4px;
      }
      .search form {
        display: flex;
        gap: 4px;
        margin: 0;
      }
      .search input {
        flex: 1;
        min-width: 0;
      }
      .search button.result {
        text-align: left;
        border: 0;
        background: #eef2ec;
        border-radius: 6px;
        padding: 4px 6px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #9aa59f;
        border: 2px solid #fff;
      }
      .osm {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #2f6fd6;
        border: 3px solid #fff;
        box-shadow: 0 0 0 2px #2f6fd6;
      }
      .pick {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--slide);
        border: 3px solid #fff;
        box-shadow: 0 0 0 3px var(--slide);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>人工定位工具（只在本機使用）</h1>
      <p class="rule">
        定位依據只能是：實地確認、OSM 地圖上可見的公園範圍、政府公告的地址。不可以用 Google
        地圖查座標。
      </p>
    </header>
    <main>
      <aside>
        <div class="tabs" role="group" aria-label="篩選">
          <button type="button" data-filter="todo" aria-pressed="true">待處理</button>
          <button type="button" data-filter="done" aria-pressed="false">已處理</button>
          <button type="button" data-filter="all" aria-pressed="false">全部</button>
          <span class="meta" id="progress" style="margin-left: auto; align-self: center"></span>
        </div>
        <ul id="list" aria-label="清冊資料"></ul>
        <section id="detail" aria-live="polite"><p class="meta">從上面選一筆。</p></section>
      </aside>
      <section class="mapwrap" aria-label="地圖">
        <div class="search">
          <form id="search">
            <input
              id="q"
              type="search"
              placeholder="搜尋地址或路口，只用來移動地圖（OSM Nominatim）"
              aria-label="搜尋地址"
            />
            <button class="btn" type="submit">搜尋</button>
          </form>
          <div id="results"></div>
          <button class="btn" type="button" id="basemap">底圖：OSM 標準</button>
        </div>
        <div id="map"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
