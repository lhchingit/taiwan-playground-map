<style>
/* Layout: 左側篩選＋結果欄、右側地圖；手機改為上地圖下清單。磨石子紋理只用在頁首。 */
:root{
  --paper:#F5F7F2; --panel:#FFFFFF; --ink:#1D2A25; --muted:#5E6E67; --line:#DCE3DC;
  --teal:#1C7A69; --teal-soft:#DDF0EA; --slide:#E27A1F; --slide-soft:#FCEBD9;
  --no:#9AA59F; --chip:#EEF2EC;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131A17; --panel:#1A2320; --ink:#E6EEE9; --muted:#9DB0A7; --line:#2C3934;
  --teal:#4FC2AB; --teal-soft:#183A33; --slide:#F29A4A; --slide-soft:#3A2817; --no:#66746D; --chip:#22302B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131A17; --panel:#1A2320; --ink:#E6EEE9; --muted:#9DB0A7; --line:#2C3934;
  --teal:#4FC2AB; --teal-soft:#183A33; --slide:#F29A4A; --slide-soft:#3A2817; --no:#66746D; --chip:#22302B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--f-body);display:grid;grid-template-columns:400px 1fr;grid-template-rows:100%;}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--slide);outline-offset:2px}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
header{padding:16px 16px 12px;position:relative;overflow:hidden;
  background:
   radial-gradient(circle at 12% 30%,var(--slide-soft) 0 3px,transparent 4px),
   radial-gradient(circle at 70% 20%,var(--teal-soft) 0 4px,transparent 5px),
   radial-gradient(circle at 40% 80%,var(--line) 0 2px,transparent 3px),
   radial-gradient(circle at 88% 70%,var(--slide-soft) 0 2px,transparent 3px);
  background-size:60px 46px,74px 58px,38px 34px,52px 40px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-size:24px;margin:0;letter-spacing:.02em;font-weight:400}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.origin{margin-top:12px;display:grid;gap:8px}
.orow{display:flex;gap:6px}
.orow input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--panel)}
.btn.on{background:var(--slide-soft);border-color:var(--slide)}
.olabel{font-size:12.5px;color:var(--muted)}
.olabel b{color:var(--ink);font-weight:500}
#geoRes{display:grid;gap:2px}
#geoRes button{text-align:left;border:0;background:var(--chip);padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--panel)}
#scroll{overflow:auto;flex:1;min-height:0}
details.filters{border-bottom:1px solid var(--line)}
details.filters>summary{padding:10px 16px;cursor:pointer;font-weight:500;display:flex;justify-content:space-between;list-style:none}
details.filters>summary::-webkit-details-marker{display:none}
.fbody{padding:0 16px 14px;display:grid;gap:14px}
.fgroup h3{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pgroups{display:grid;gap:8px}
.pg{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:start}
.pg>span{font-size:12px;color:var(--muted);padding-top:5px}
.pg>button.gname{font:inherit;font-size:12px;text-align:left;border:1px dashed var(--muted);border-radius:999px;background:none;padding:3px 8px;cursor:pointer;color:var(--muted)}
.pg>button.gname[aria-pressed=true]{border-style:solid;font-weight:600;color:inherit}
.unk{font-size:12.5px;color:var(--muted);padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--panel)}
.rangerow{display:flex;align-items:center;gap:10px}
.rangerow input[type=range]{flex:1;accent-color:var(--teal)}
.rangerow output{min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.toggle input{accent-color:var(--slide);width:16px;height:16px}
select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.resbar{padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line)}
.resbar strong{font-family:var(--f-display);font-weight:400;font-size:18px}
#hint{font-size:12.5px;color:var(--slide)}
#list{list-style:none;margin:0;padding:8px 10px 24px;display:grid;gap:8px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--panel);display:grid;gap:6px}
.card:hover,.card.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.ctop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cname{font-weight:700;font-size:15px}
.cdist{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:500;white-space:nowrap;font-size:13px}
.cmeta{font-size:12.5px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;padding:1px 7px;border-radius:5px;border:1px solid transparent;display:inline-flex;align-items:center;gap:3px}
.tag.y{background:var(--teal-soft);color:var(--ink)}
.tag.n{color:var(--no);text-decoration:line-through;border-color:var(--line)}
.tag.u{color:var(--muted);border:1px dashed var(--no)}
.pill{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--slide-soft);color:var(--ink)}
#mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0}
#mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.mk{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--teal);border:2px solid var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;display:grid;place-items:center}
.mk span{transform:rotate(45deg);color:var(--panel);font-size:12px;font-weight:700}
.mk.sel{background:var(--slide);width:36px;height:36px}
.mk.off{display:none}
.cnum{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--teal);color:var(--panel);font-size:11.5px;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.card.sel .cnum{background:var(--slide)}
.origin-mk{width:18px;height:18px;border-radius:50%;background:var(--slide);border:3px solid var(--panel);box-shadow:0 0 0 6px color-mix(in srgb,var(--slide) 30%,transparent)}
#detail{position:absolute;right:16px;top:16px;bottom:16px;width:min(380px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:auto;z-index:5}
.dhead{padding:16px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.dhead h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.dclose{position:absolute;right:10px;top:10px;border:0;background:var(--chip);border-radius:50%;width:30px;height:30px;cursor:pointer}
.dsec{padding:12px 16px;border-bottom:1px solid var(--line)}
.dsec h3{font-size:11.5px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.arow{display:grid;grid-template-columns:22px 92px 1fr;gap:6px;font-size:13px;padding:4px 0;border-top:1px dashed var(--line);align-items:start}
.arow:first-of-type{border-top:0}
.st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.st.y{background:var(--teal);color:var(--panel)}
.st.n{background:var(--line);color:var(--muted)}
.st.u{border:1px dashed var(--no);color:var(--muted)}
.asrc{color:var(--muted);font-size:12px}
.asrc a{color:var(--teal)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions a{text-decoration:none}
form.report{display:grid;gap:8px;margin-top:10px}
.note{font-size:12px;color:var(--muted)}
.ok{font-size:12.5px;color:var(--teal)}
@media (max-width:820px){
  body{grid-template-columns:1fr;grid-template-rows:42vh 1fr}
  #mapwrap{grid-row:1}
  #side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  #side{overflow:auto}
  #scroll{overflow:visible;flex:none}
  .resbar{top:0}
  #detail{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-height:78vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  <div id="scroll">

            <option value="4">4 歲</option><option value="5">5 歲</option><option value="6">6 歲</option>
            <option value="7">7 歲</option><option value="8">8 歲</option><option value="10">9–10 歲</option><option value="12">11–12 歲</option>
          </select>
        </div>
        <div class="fgroup"><h3>遊樂設施（選的都要有．按類別名稱＝其中任一種）</h3><div id="playGroups" class="pgroups"></div></div>
        <div class="fgroup"><h3>生活機能（全部都要有）</h3><div class="chips" id="amenChips"></div></div>
        <div class="fgroup" style="display:grid;gap:8px"><h3 style="margin:0">停車</h3>
          <div class="chips" id="pkTypeChips"></div>
          <div class="seg" role="group" aria-label="停車費用" id="pkFeeSeg">
            <button type="button" data-fee="any" aria-pressed="true">費用不限</button>
            <button type="button" data-fee="free" aria-pressed="false">免費</button>
            <button type="button" data-fee="paid" aria-pressed="false">付費</button>
          </div>
          <label class="toggle" for="pkMin">至少
            <select id="pkMin" aria-label="最少停車格數"><option value="">不限</option><option value="10">10</option><option value="30">30</option><option value="50">50</option><option value="100">100</option></select> 格</label>
        </div>
        <div class="fgroup"><h3>建議停留時長</h3><div class="chips" id="stayChips"></div></div>
        <div class="fgroup"><h3>場地規模</h3><div class="chips" id="sizeChips"></div></div>
        <div class="fgroup"><h3>室內／戶外</h3>
          <div class="seg" role="group" aria-label="室內戶外" id="envSeg">
            <button type="button" data-env="all" aria-pressed="true">全部</button>
            <button type="button" data-env="out" aria-pressed="false">戶外</button>
            <button type="button" data-env="in" aria-pressed="false">室內</button>
          </div>
        </div>
        <div class="fgroup" style="display:grid;gap:8px">
          <label class="toggle"><input type="checkbox" id="freeOnly"> 只看免費</label>
          <label class="toggle"><input type="checkbox" id="incUnknown"> 包含「資料未知」的場地</label>
        </div>
        <button class="btn" type="button" id="btnReset">清除篩選</button>
      </div>
    </details>
    <div class="resbar"><div><strong id="count">0</strong> 處符合</div><div id="hint"></div></div>
    <ul id="list"></ul>
  </div>
</aside>
<main id="mapwrap">
  <div id="mapmsg">地圖載入中…</div>

</main>

const P = DATA.places, L = DATA.labels, S = DATA.sources;
const STAY = {lt30:"30 分鐘內", "30_60":"30 分–1 小時", "60_120":"1–2 小時", half:"半天以上"};
const SIZE = {S:"小型（社區）", M:"中型", L:"大型"};
const MODE = {drive:{label:"開車",kmh:30,g:"driving"}, scooter:{label:"機車",kmh:25,g:"two-wheeler"}, walk:{label:"步行",kmh:4.5,g:"walking"}, transit:{label:"大眾運輸",kmh:null,g:"transit"}};
const DETOUR = 1.35; // 直線距離換算道路距離的經驗係數
const STATE_TXT = {y:"有", n:"無", u:"未知"};
const PK_TYPE = {lot:"停車場", street:"路邊停車格", none:"無停車位", u:"類型未知"};
const PK_FEE = {free:"免費", paid:"付費", u:"費用未知"};

const st = {
  origin:{lat:24.80163,lng:120.97163,name:"新竹火車站（範例）"},
  mode:"drive", maxKm:null, age:null, play:new Set(), grp:new Set(), amen:new Set(), stay:new Set(), size:new Set(),
  env:"all", free:false, pkType:new Set(), pkFee:"any", pkMin:null, unk:false, sel:null, picking:false

try{ const s=JSON.parse(localStorage.getItem("pm.prefs")||"{}"); if(s.mode&&MODE[s.mode]) st.mode=s.mode; }catch(e){}

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function hav(a,b){const R=6371,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function est(km){const m=MODE[st.mode]; if(!m.kmh) return null; return Math.max(1,Math.round(km*DETOUR/m.kmh*60));}
function fmtKm(km){return km<1?Math.round(km*1000)+" 公尺":km.toFixed(1)+" 公里";}

// 篩選：屬性為 y 才通過；開啟「包含未知」時 u 也通過
function passAttr(p,k,unk){const v=p.attrs[k].v; return v==="y"||(unk&&v==="u");}
function pass(p,unk){
  if(st.maxKm!=null && p._km>st.maxKm) return false;
  if(st.age!=null){ if(p.age_min==null){ if(!unk) return false; } else if(st.age<p.age_min||st.age>p.age_max) return false; }
  for(const k of st.play) if(!passAttr(p,k,unk)) return false;
  // 遊樂設施類別（decisions D26）：這一類有其中任一種即可
  for(const g of L.play_groups) if(st.grp.has(g.name) && !g.keys.some(k=>passAttr(p,k,unk))) return false;
  for(const k of st.amen) if(!passAttr(p,k,unk)) return false;
  if(st.stay.size && !st.stay.has(p.stay)) return false;
  if(st.size.size && !st.size.has(p.size)) return false;
  if(st.env==="out" && p.indoor) return false;
  if(st.env==="in" && !p.indoor) return false;
  if(st.free && p.fee!=="free") return false;
  const pk=p.parking;
  if(st.pkType.size && !(st.pkType.has(pk.type)||(unk&&pk.type==="u"))) return false;
  if(st.pkFee!=="any"){ if(pk.type==="none") return false;
    if(!(pk.fee===st.pkFee||(unk&&pk.fee==="u"))) return false; }
  if(st.pkMin!=null){ if(pk.type==="none") return false;
    if(!(pk.spaces!=null ? pk.spaces>=st.pkMin : unk)) return false; }
  return true;
}

function chips(el,map,set){

  el.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;
    set.has(k)?set.delete(k):set.add(k);b.setAttribute("aria-pressed",set.has(k));render();});
}

function topTags(p){
  const gk=L.play_groups.filter(g=>st.grp.has(g.name)).flatMap(g=>{const y=g.keys.filter(k=>p.attrs[k].v==="y");return y.length?y:g.keys.filter(k=>p.attrs[k].v==="u");});
  const keys=[...st.play,...gk,...st.amen];
  const pick=keys.length?keys:Object.keys(p.attrs).filter(k=>p.attrs[k].v==="y").slice(0,6);
  const pkOn=st.pkType.size||st.pkFee!=="any"||st.pkMin!=null;
  return (pkOn?pkTag(p):"")+pick.map(k=>{const v=p.attrs[k].v;const lab=L.play[k]||L.amenity[k];
    return `<span class="tag ${v}" title="${STATE_TXT[v]}">${v==="u"?"?":""}${esc(lab)}</span>`}).join("");
}
function pkText(pk){
  if(pk.type==="none") return "無停車位";
  const parts=[PK_TYPE[pk.type]];
  if(pk.fee!=="u") parts.push(PK_FEE[pk.fee]);
  if(pk.spaces!=null) parts.push(`約 ${pk.spaces} 格`);
  return parts.join("．");
}
function pkTag(p){const pk=p.parking;const c=pk.type==="none"?"n":pk.type==="u"?"u":"y";
  return `<span class="tag ${c}">${c==="u"?"?":""}停車：${esc(pkText(pk))}</span>`;}
function ageTxt(p){return p.age_min==null?"年齡未知":`${p.age_min}–${p.age_max} 歲`;}
function distTxt(p){const m=est(p._km);return m==null?fmtKm(p._km):`${fmtKm(p._km)}．約 ${m} 分`;}

function activeCount(){return st.play.size+st.grp.size+st.amen.size+st.stay.size+st.size.size+st.pkType.size+(st.pkFee!=="any")+(st.pkMin!=null)+(st.maxKm!=null)+(st.age!=null)+(st.env!=="all")+st.free;}

function render(){
  P.forEach(p=>p._km=hav(st.origin,p));
  const hit=P.filter(p=>pass(p,st.unk)).sort((a,b)=>a._km-b._km);
  const withUnk=P.filter(p=>pass(p,true)).length;
  $("#count").textContent=hit.length;
  $("#hint").textContent=(!st.unk&&withUnk>hit.length)?`另有 ${withUnk-hit.length} 處資料未知`:"";
  const n=activeCount();$("#fcount").hidden=!n;$("#fcount").textContent=n+" 項";
  $("#originName").textContent=st.origin.name;
  $("#list").innerHTML=hit.length?hit.map(p=>`
    <li class="card${st.sel===p.id?" sel":""}" data-id="${p.id}" tabindex="0">
      <div class="ctop"><span class="cname"><span class="cnum">${hit.indexOf(p)+1}</span>${esc(p.name)}</span><span class="cdist">${distTxt(p)}</span></div>
      <div class="cmeta">${esc(p.district)}．${ageTxt(p)}．停留 ${STAY[p.stay]}${p.status==="seasonal"?' ．<span class="pill">季節性開放</span>':""}</div>
      <div class="tags">${topTags(p)}</div>
    </li>`).join(""):`<li class="note" style="padding:16px">沒有符合的場地。試著放寬距離，或開啟「包含資料未知的場地」。</li>`;
  const ids=new Set(hit.map(p=>p.id));
  const rank=new Map(hit.map((p,i)=>[p.id,i+1]));
  markers.forEach((m,id)=>{const r=rank.get(id);m.el.classList.toggle("off",!r);m.el.classList.toggle("sel",st.sel===id);
    if(r) m.el.firstChild.textContent=r;});
  if(st.sel&&!ids.has(st.sel)){st.sel=null;$("#detail").hidden=true;}
  if(st.sel) showDetail(P.find(p=>p.id===st.sel));
}
$("#list").addEventListener("click",e=>{const c=e.target.closest(".card");if(c)select(c.dataset.id,true);});
$("#list").addEventListener("keydown",e=>{if(e.key==="Enter"){const c=e.target.closest(".card");if(c)select(c.dataset.id,true);}});

function srcHtml(a){
  if(a.v==="u"&&!a.src) return '<span class="asrc">尚無資料</span>';
  const s=S[a.src];const lab=s?(s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`:esc(s.label)):"";
  return `${a.note?esc(a.note)+"<br>":""}<span class="asrc">${lab}${a.at?"．"+a.at:""}</span>`;
}
function gmaps(p){const m=MODE[st.mode].g==="two-wheeler"?"driving":MODE[st.mode].g;
  return `https://www.google.com/maps/dir/?api=1&origin=${st.origin.lat},${st.origin.lng}&destination=${p.lat},${p.lng}&travelmode=${m}`;}

function showDetail(p){
  const d=$("#detail");if(!p){d.hidden=true;return;}
  // 已知（有／無）逐列列出，未知的收成一行，避免整頁都是問號
  const sec=(title,map)=>{const ks=Object.keys(map);const known=ks.filter(k=>p.attrs[k].v!=="u"||p.attrs[k].src);
    const unknown=ks.filter(k=>!known.includes(k));
    return `<div class="dsec"><h3>${title}</h3>${known.map(k=>{const a=p.attrs[k];
    return `<div class="arow"><span class="st ${a.v}">${a.v==="y"?"✓":a.v==="n"?"–":"?"}</span><span>${esc(map[k])}</span><span>${srcHtml(a)}</span></div>`}).join("")}
    ${unknown.length?`<div class="unk">還沒有資料：${unknown.map(k=>esc(map[k])).join("、")}</div>`:""}</div>`;};
  const m=est(p._km);
  d.innerHTML=`
   <button class="dclose" type="button" aria-label="關閉">✕</button>
   <div class="dhead">
     <h2>${esc(p.name)}</h2>
     <div class="cmeta">${esc(p.address||p.district+"（地址待補）")}</div>
     <div>${esc(p.summary)}</div>
     <div class="actions">
       <a class="btn primary" href="${gmaps(p)}" target="_blank" rel="noopener">查實際路線（Google 地圖）</a>

     </div>
     <div id="reportBox"></div>
   </div>
   <div class="dsec"><h3>基本資料</h3><dl class="facts">
     <dt>距離</dt><dd>直線 ${fmtKm(p._km)}${m!=null?`，${MODE[st.mode].label}約 ${m} 分鐘（估算）`:"，大眾運輸請看 Google 地圖"}</dd>
     <dt>適合年齡</dt><dd>${ageTxt(p)}</dd>
     <dt>建議停留</dt><dd>${STAY[p.stay]}　<span class="asrc">${esc(S[p.stay_src].label)}</span></dd>
     <dt>規模</dt><dd>${SIZE[p.size]}${p.area_ha?`（${p.area_ha} 公頃）`:""}</dd>

   <div class="dsec"><h3>停車</h3><dl class="facts">
     <dt>類型</dt><dd>${PK_TYPE[p.parking.type]}</dd>
     <dt>費用</dt><dd>${p.parking.type==="none"?"—":PK_FEE[p.parking.fee]}</dd>

}
function reportForm(p){
  const opts=Object.entries({...L.play,...L.amenity}).map(([k,v])=>`<option value="${k}">${esc(v)}（目前：${STATE_TXT[p.attrs[k].v]}）</option>`).join("");
  $("#reportBox").innerHTML=`<form class="report" id="rf">
    <select id="rfKey" aria-label="要修正的項目">${opts}</select>
    <div class="seg" role="group" aria-label="實際狀況" id="rfVal">
      <button type="button" data-v="y" aria-pressed="true">有</button><button type="button" data-v="n" aria-pressed="false">沒有</button></div>
    <input id="rfNote" placeholder="補充說明（選填），例如：洗腳池在東側入口" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)">
    <button class="btn primary" type="submit">送出修正建議</button>
    <p class="note">原型階段：建議只存在這台瀏覽器，正式版會進入審核佇列。</p></form>`;
  let v="y";$("#rfVal").onclick=e=>{const b=e.target.closest("button");if(!b)return;v=b.dataset.v;
    $("#rfVal").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));};
  $("#rf").onsubmit=e=>{e.preventDefault();
    const rec={place:p.id,key:$("#rfKey").value,value:v,note:$("#rfNote").value,at:new Date().toISOString(),status:"pending"};
    try{const q=JSON.parse(localStorage.getItem("pm.reports")||"[]");q.push(rec);localStorage.setItem("pm.reports",JSON.stringify(q));}catch(err){}
    $("#reportBox").innerHTML=`<p class="ok">已收到你的修正建議，審核通過後會更新。</p>`;};
}

// ---- 地圖 ----
const markers=new Map(); let map=null, originMk=null;
function select(id,fly){st.sel=id;const p=P.find(x=>x.id===id);render();
  if(fly&&map&&p) map.flyTo({center:[p.lng,p.lat],zoom:Math.max(map.getZoom(),14.5),offset:innerWidth>820?[-190,0]:[0,0]});}
function setOrigin(lat,lng,name){st.origin={lat,lng,name};if(originMk)originMk.setLngLat([lng,lat]);render();fitAll();}
function fitAll(){if(!map)return;const b=new maplibregl.LngLatBounds();b.extend([st.origin.lng,st.origin.lat]);
  P.filter(p=>pass(p,st.unk)).forEach(p=>b.extend([p.lng,p.lat]));
  map.fitBounds(b,{padding:{top:60,bottom:60,left:60,right:innerWidth>820?420:60},maxZoom:15,duration:600});}

const RASTER={version:8,sources:{c:{type:"raster",tiles:["https://a.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png","https://b.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png"],tileSize:256,attribution:"© OpenStreetMap contributors © CARTO"}},layers:[{id:"c",type:"raster",source:"c"}]};
function initMap(){
  if(typeof maplibregl==="undefined"){$("#mapmsg").textContent="地圖元件載入失敗（可能離線）。清單與篩選仍可使用。";return;}
  map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[120.965,24.805],zoom:12,attributionControl:{compact:true}});
  let loaded=false,fell=false;const fallback=()=>{if(!loaded&&!fell){fell=true;map.setStyle(RASTER);}};
  map.on("load",()=>{loaded=true;$("#mapmsg").hidden=true;});
  map.on("styledata",()=>{$("#mapmsg").hidden=true;});
  map.on("error",fallback);setTimeout(fallback,7000);
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  P.forEach((p,i)=>{const el=document.createElement("div");el.className="mk";el.title=p.name;el.innerHTML="<span></span>";
    el.addEventListener("click",ev=>{ev.stopPropagation();select(p.id,false);});
    const m=new maplibregl.Marker({element:el,anchor:"bottom-left"}).setLngLat([p.lng,p.lat]).addTo(map);m.el=el;markers.set(p.id,m);});
  const oe=document.createElement("div");oe.className="origin-mk";oe.title="出發點";
  originMk=new maplibregl.Marker({element:oe}).setLngLat([st.origin.lng,st.origin.lat]).addTo(map);
  map.on("click",e=>{if(!st.picking)return;st.picking=false;$("#btnPick").classList.remove("on");$("#btnPick").setAttribute("aria-pressed","false");
    map.getCanvas().style.cursor="";setOrigin(e.lngLat.lat,e.lngLat.lng,`地圖上的點（${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}）`);});
  setTimeout(fitAll,300);
}

// ---- 出發點 ----
function locate(silent){
  if(!navigator.geolocation){if(!silent)$("#originName").textContent="這個瀏覽器不支援定位，請改輸入地址";return;}
  $("#btnLocate").textContent="定位中…";
  navigator.geolocation.getCurrentPosition(pos=>{$("#btnLocate").textContent="使用目前位置";
      setOrigin(pos.coords.latitude,pos.coords.longitude,"目前位置");},
    ()=>{$("#btnLocate").textContent="使用目前位置";if(!silent)$("#originName").textContent="無法取得定位，請改輸入地址或在地圖上點選";},
    {enableHighAccuracy:false,timeout:8000,maximumAge:300000});
}
$("#btnLocate").onclick=()=>locate(false);
$("#btnPick").onclick=()=>{st.picking=!st.picking;$("#btnPick").classList.toggle("on",st.picking);$("#btnPick").setAttribute("aria-pressed",st.picking);
  if(map)map.getCanvas().style.cursor=st.picking?"crosshair":"";};
$("#geoForm").onsubmit=async e=>{e.preventDefault();const q=$("#addr").value.trim();if(!q)return;const box=$("#geoRes");
  box.innerHTML='<span class="note">搜尋中…</span>';
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tw&accept-language=zh-TW&limit=5&q=${encodeURIComponent(q)}`);
    const js=await r.json();
    box.innerHTML=js.length?js.map((x,i)=>`<button type="button" data-i="${i}">${esc(x.display_name)}</button>`).join(""):'<span class="note">找不到這個地址。試試加上「新竹市」，或改用地標名稱。</span>';
    box.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const x=js[+b.dataset.i];
      setOrigin(+x.lat,+x.lon,x.name||q);box.innerHTML="";};
  }catch(err){box.innerHTML='<span class="note">地址搜尋服務連不上，請改用「在地圖上點選」。</span>';}
};

if(innerWidth<=820) document.querySelector('details.filters').open=false;
document.getElementById("total").textContent=P.length;
initMap();render();locate(true);
</script>
</body>
