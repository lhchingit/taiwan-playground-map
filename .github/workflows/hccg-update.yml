# 每季檢查新竹市政府的開放資料（清冊、公園、公廁）有沒有更新。
# 只讀公開資料：不碰資料庫、不用任何 secret（只有內建的 GITHUB_TOKEN）、不改 repo。
# 有變動就開 issue（已經有開著的「資料更新」issue 時改成留言）；處理步驟見 docs/operations.md「政府資料更新」。
name: 政府資料更新檢查

on:
  schedule:
    - cron: '0 1 1 1,4,7,10 *' # 1、4、7、10 月 1 日 01:00 UTC（台灣時間 09:00）
  workflow_dispatch:

concurrency:
  group: hccg-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  check:
    name: 檢查新竹市政府資料
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 結束碼：0 沒有變動／1 有變動／2 下載或讀取失敗（讓 job 失敗，GitHub 會寄信通知）
      - name: 檢查
        id: check
        run: |
          set +e
          python scripts/check_hccg_update.py --report report.md
          code=$?
          set -e
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$code" -eq 2 ]; then exit 1; fi
          echo "changed=$([ "$code" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 開 issue 或留言
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=資料更新
          gh label create "$label" --color 0e8a16 --description "政府開放資料有更新，需要重新匯入" --force
          echo -e "\n---\n由[政府資料更新檢查]($RUN_URL)自動產生。" >> report.md
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "新竹市政府資料有更新（$(date -u +%F)）" --label "$label" --body-file report.md
          fi
