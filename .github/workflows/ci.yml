name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / 單元測試 / seed 雜湊
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 匯入腳本（Python）的測試
      - run: python -m unittest discover -s scripts/tests -t scripts
      # places.json 必須和產生它的腳本、原始資料一致
      - run: python scripts/check_seed_hash.py

  workflows:
    name: workflow 語法檢查（actionlint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  db:
    name: 資料庫、e2e 與 Docker（migration / seed / RLS / Playwright / compose）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 只開測試需要的服務（postgres、postgrest、kong、gotrue；mailpit 收 e2e 的登入信）
      - run: pnpm exec supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta
      - run: pnpm exec supabase db reset
      - run: pnpm seed
      # 第二次：確認可以重複執行
      - run: pnpm seed
      # 匯入不會自動上線（docs/operations.md）
      - run: pnpm city launch hsc
      - run: pnpm test:db
      # 產生的資料庫型別必須和 migration 一致
      - run: pnpm typegen && git diff --exit-code src/types/database.ts
      # e2e：Next.js 讀 .env.local 連本機 Supabase；地圖圖磚與 Nominatim 在測試中攔截
      - run: pnpm env:local
      - run: pnpm exec playwright install --with-deps chromium
      # 標準答案要跟原型＋目前的種子資料一致（scripts/regen-filter-cases.ts）
      - run: pnpm regen:filter-cases --check
      - run: pnpm test:e2e
      # Docker：映像檔能建置（建置時連本機 Supabase）、容器健康、主要頁面回 200
      - run: docker compose --env-file .env.local up --build -d --wait
      - run: |
          for u in /hsinchu-city /hsinchu-city/places/hsc-luguang-park /api/cities/hsc/places; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$u")
            echo "$code $u"
            test "$code" = 200
          done
      - if: always()
        run: docker compose --env-file .env.local down || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
